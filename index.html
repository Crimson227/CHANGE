<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>逻辑重构 // LIGHTWAVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-pink: #ff00ff; /* Darker pink for light bg */
        --neon-blue: #0099cc; /* Darker blue for light bg */
        --neon-green: #00cc66;
        --neon-purple: #9933ff;
        --light-bg: #f3f4f6;
        --glass-white: rgba(255, 255, 255, 0.85);
      }

      body {
        background-color: var(--light-bg);
        color: #1f2937;
        font-family: 'Noto Sans SC', sans-serif;
        overflow: hidden;
      }
      
      .font-pixel {
        font-family: 'VT323', monospace;
      }

      .font-serif-sc {
        font-family: 'Noto Serif SC', serif;
      }

      /* Vaporwave Grid Background - Light Mode Version */
      .vapor-grid {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 45vh;
        background: 
          linear-gradient(transparent 0%, #ffffff 100%),
          linear-gradient(0deg, rgba(255, 0, 255, 0.15) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 153, 204, 0.15) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
        transform: perspective(500px) rotateX(60deg) translateY(50px) scale(2);
        animation: grid-move 20s linear infinite;
        z-index: 0;
        pointer-events: none;
        mask-image: linear-gradient(to bottom, transparent, black);
      }

      @keyframes grid-move {
        0% { background-position: 0 0, 0 0, 0 0; }
        100% { background-position: 0 0, 0 40px, 0 0; }
      }

      /* Subtle Scanlines for Texture */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(0,0,0,0),
          rgba(0,0,0,0) 50%,
          rgba(0,0,0,0.03) 50%,
          rgba(0,0,0,0.03)
        );
        background-size: 100% 4px;
        z-index: 999;
        pointer-events: none;
        opacity: 0.8;
      }
      
      /* Retro Shadow Style */
      .retro-shadow {
        box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border: 1px solid white;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--neon-pink);
      }

      /* Animations */
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
